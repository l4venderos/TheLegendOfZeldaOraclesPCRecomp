name: v0.2.4 source package and tests

on:
  push:
    branches:
      - v0.2.4-work
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure portable runtime and tests
        run: cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build test targets
        run: cmake --build build --target oracles-test-binaries --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Package source ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=Oracles-PC-Recomp-v0.2.4/ HEAD -o dist/Oracles-PC-Recomp-v0.2.4-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Oracles-PC-Recomp-v0.2.4-source
          path: dist/Oracles-PC-Recomp-v0.2.4-source.zip
          if-no-files-found: error
